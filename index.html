<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול גמ"ח כספים</title>
<style>
:root{
  --bg:#f4f7f4; --card:#ffffff; --ink:#183a2a; --muted:#6b7c72;
  --green:#1f7a4d; --green-d:#155c39; --green-l:#e7f3ec; --line:#dbe6de;
  --red:#b23b3b; --amber:#b9821f; --blue:#2a5f8f; --shadow:0 2px 10px rgba(20,60,40,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer}
.app{max-width:1150px;margin:0 auto;padding:0 14px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 4px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow)}
.brand h1{font-size:20px}
.brand .sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:22px;font-size:14px;transition:.15s}
nav.tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lbl{color:var(--muted);font-size:13px;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:700}
.kpi .val.small{font-size:20px}
.kpi.accent{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;border:0}
.kpi.accent .lbl{color:#d9efe2}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--muted)}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-l);border-color:var(--green)}
.btn{background:var(--green);color:#fff;border:0;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600}
.btn:hover{background:var(--green-d)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn.mini{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{background:var(--red)}
.btn.gray{background:#eef2ef;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12.5px;background:#f8faf8}
tbody tr:hover{background:#fafcfa}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.tag.open{background:#eaf4ff;color:var(--blue)}
.tag.closed{background:var(--green-l);color:var(--green-d)}
.tag.over{background:#fbe8e8;color:var(--red)}
.tag.wait{background:#fbf3e2;color:var(--amber)}
.link{color:var(--green-d);text-decoration:none;font-weight:600;cursor:pointer;border:0;background:none;font-size:14px}
.link:hover{text-decoration:underline}
.muted{color:var(--muted)}
.right{margin-inline-start:auto}
.search{flex:1;min-width:200px}
.empty{text-align:center;color:var(--muted);padding:26px}
.overlay{position:fixed;inset:0;background:rgba(20,40,30,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h2{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:#eef2ef;width:32px;height:32px;border-radius:50%;font-size:18px}
.pill{display:inline-block;background:var(--green-l);color:var(--green-d);border-radius:8px;padding:3px 9px;font-size:12px;margin:2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.notice{background:#fff8e8;border:1px solid #f0dfae;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#7a5c17;margin-bottom:14px}
.help p{line-height:1.7}
.help h3{margin:16px 0 6px;color:var(--green-d)}
.bar{height:9px;border-radius:6px;background:#eef2ef;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--green)}
@media(max-width:560px){.split{grid-template-columns:1fr}.kpi .val{font-size:22px}}
@media print{nav.tabs,.actionsbar,.btn,.x,.toast{display:none!important}body{background:#fff}}

/* כניסה */
#loginwrap{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 50% -10%,#e7f3ec,var(--bg))}
.loginbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(20,60,40,.12);text-align:center}
.loginbox .logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:var(--shadow)}
.loginbox h1{font-size:19px;margin-bottom:2px}
.loginbox .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.loginbox .f{text-align:right;margin-bottom:12px}
.loginbox input{width:100%}
.loginbox .btn{width:100%;margin-top:6px}
.loginerr{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}

/* מסמכים להדפסה */
.docsheet{font-size:14px;line-height:1.9}
.docsheet p{margin:6px 0}
.dochead{font-size:17px;font-weight:700;color:var(--green-d);text-align:center;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--green)}
@media print{
  body.printing-doc nav.tabs,body.printing-doc header.top,body.printing-doc .toast,body.printing-doc .no-print{display:none!important}
  body.printing-doc .card:not(.print-only){display:none!important}
  body.printing-doc .card.print-only{box-shadow:none;border:0;padding:0}
  body.printing-doc{background:#fff}
}

/* toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--red)}
</style>
</head>
<body>

<div id="loginwrap">
  <form class="loginbox" onsubmit="doLogin(event)">
    <div class="logo">₪</div>
    <h1>גמ"ח כספים</h1>
    <div class="sub">כניסת מנהל — הנתונים מוגנים ואישיים</div>
    <div class="f"><label>אימייל</label><input id="lg_email" type="email" autocomplete="username" required></div>
    <div class="f"><label>סיסמה</label><input id="lg_pass" type="password" autocomplete="current-password" required></div>
    <button class="btn" id="lg_btn" type="submit">כניסה</button>
    <div class="loginerr" id="loginerr"></div>
  </form>
</div>

<div class="app" id="app" style="display:none">
  <header class="top">
    <div class="brand">
      <div class="logo">₪</div>
      <div>
        <h1 id="gname">גמ"ח כספים</h1>
        <div class="sub">מערכת ניהול הלוואות, החזרים וקופה</div>
      </div>
    </div>
    <div class="row actionsbar">
      <button class="btn gray mini" onclick="window.print()">הדפסה 🖨</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
